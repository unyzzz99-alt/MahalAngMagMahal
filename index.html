<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8e8">
  <title>Sanaol! Number Guessing Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="game-card">
    <div class="sparkle sparkle-one" aria-hidden="true">✦</div>
    <div class="sparkle sparkle-two" aria-hidden="true">✿</div>

    <header class="game-header">
      <div class="mascot" aria-hidden="true">🤔</div>
      <p class="eyebrow">A LITTLE BRAIN BREAK</p>
      <h1>Guess the<br><span>secret number!</span></h1>
      <p class="intro">I’m thinking of a number from <strong>1 to 100</strong>.<br>Can you read my mind?</p>
    </header>

    <section class="game-area" aria-label="Number guessing game">
      <div class="attempt-pill"><span class="attempt-icon" aria-hidden="true">🎯</span> Guesses: <strong id="attempt-count">0</strong></div>

      <form id="guess-form" novalidate>
        <label for="guess-input">Your lucky number</label>
        <div class="input-row">
          <input id="guess-input" name="guess" type="number" min="1" max="100" step="1"
            inputmode="numeric" placeholder="e.g. 42" autocomplete="off" required>
          <button class="guess-button" type="submit">Guess it! <span aria-hidden="true">→</span></button>
        </div>
      </form>

      <p id="feedback" class="feedback" role="status" aria-live="polite">Make your first guess. You’ve got this! ✨</p>
      <div class="result-area">
        <button id="restart-button" class="restart-button" type="button" hidden>Play again <span aria-hidden="true">↻</span></button>
        <p id="sanaol" class="sanaol" hidden>Sanaol Mali 😜</p>
        <p id="congratulations" class="congratulations" hidden></p>
      </div>
      <p id="error-message" class="error-message" role="alert" hidden></p>
    </section>

    <footer>Made for curious minds <span aria-hidden="true">💛</span></footer>
  </main>
</body>
</html>
